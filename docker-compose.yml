version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
    image: ghcr.io/s4ndyp/bankey:latest
    container_name: financepro-container
    restart: unless-stopped
    ports:
      - "7104:8090"
    volumes:
      - pocketbase_data:/pb/pb_data

volumes:
  pocketbase_data:
